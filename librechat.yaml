# Enterprise LibreChat Configuration
# Databricks AI Gateway as exclusive LLM provider
# https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.7

cache: true

# File storage (local for now, switch to Azure Blob in production)
fileStrategy: "local"

# Interface configuration
interface:
  customWelcome: 'Welcome to Enterprise AI. Select a model and start chatting.'
  fileSearch: true
  privacyPolicy:
    externalUrl: 'https://yourcompany.com/privacy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://yourcompany.com/terms'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Terms of Service'
    modalContent: |
      # Enterprise AI Platform Terms of Service

      By using this platform, you agree to the organization's acceptable use policy.
      Do not input classified or restricted data unless explicitly authorized.

  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: true
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: true
    public: false
  mcpServers:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true

# Registration: OpenID only (Azure AD)
registration:
  socialLogins: ['openid']
  # allowedDomains:
  #   - "yourcompany.com"

# Agent Actions domain restrictions
actions:
  allowedDomains:
    - 'yourcompany.com'
    # Add internal API domains as needed

# MCP Server domain restrictions
# mcpSettings:
#   allowedDomains:
#     - 'yourcompany.com'
#     - 'localhost'

# Endpoints: Databricks AI Gateway only
endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    capabilities: ["deferred_tools", "execute_code", "file_search", "actions", "tools"]
    # Restrict agent provider to Databricks only
    # allowedProviders:
    #   - "Databricks"

  custom:
    # Databricks AI Gateway (OpenAI-compatible)
    - name: 'Databricks'
      apiKey: '${DATABRICKS_API_KEY}'
      baseURL: '${DATABRICKS_GATEWAY_URL}'
      models:
        default:
          - 'databricks-claude-opus-4-6'
          - 'databricks-claude-sonnet-4-6'
          - 'databricks-claude-sonnet-4-5'
          - 'databricks-claude-opus-4-5'
          - 'databricks-claude-opus-4-1'
          - 'databricks-claude-sonnet-4'
          - 'databricks-claude-3-7-sonnet'
          - 'databricks-claude-haiku-4-5'
          - 'databricks-gpt-oss-120b'
          - 'databricks-gpt-oss-20b'
          - 'databricks-llama-4-maverick'
          - 'databricks-meta-llama-3-3-70b-instruct'
          - 'databricks-meta-llama-3-1-8b-instruct'
          - 'databricks-gemma-3-12b'
        fetch: false
      titleConvo: true
      titleModel: 'databricks-gpt-oss-20b'
      modelDisplayLabel: 'AI Gateway'
      iconURL: '/assets/databricks.svg'
      # Required for Anthropic models on Databricks gateway (they mandate max_tokens)
      addParams:
        max_tokens: 4096
      # Drop params not supported by Databricks gateway (adjust as needed)
      # dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      # Add custom headers for governance tracking
      # headers:
      #   x-conversation-id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'

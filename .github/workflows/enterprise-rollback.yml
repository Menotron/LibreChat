name: Enterprise Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to rollback to (e.g. a1b2c3d)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: enterprise-ai

jobs:
  rollback:
    name: Rollback App Service
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    timeout-minutes: 10

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify image tag exists
        run: |
          TAGS=$(az acr repository show-tags \
            --name ${{ vars.ACR_NAME }} \
            --repository ${{ env.IMAGE_NAME }} \
            --query "[?@ == '${{ github.event.inputs.image_tag }}']" \
            --output tsv)
          if [ -z "$TAGS" ]; then
            echo "ERROR: Tag '${{ github.event.inputs.image_tag }}' not found in ${{ vars.ACR_NAME }}/${{ env.IMAGE_NAME }}"
            echo "Available tags:"
            az acr repository show-tags \
              --name ${{ vars.ACR_NAME }} \
              --repository ${{ env.IMAGE_NAME }} \
              --orderby time_desc \
              --top 10 \
              --output tsv
            exit 1
          fi
          echo "Found tag: ${TAGS}"

      - name: Update container image
        run: |
          az webapp config container set \
            --name ${{ vars.APP_SERVICE_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --container-image-name ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ vars.APP_SERVICE_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }}

      - name: Wait for health check
        run: |
          APP_URL="https://${{ vars.APP_SERVICE_NAME }}.azurewebsites.net"
          echo "Waiting for ${APP_URL}/health ..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed on attempt ${i}"
              exit 0
            fi
            echo "  Attempt ${i}/20: HTTP ${STATUS} — retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 5 minutes"
          exit 1

      - name: Rollback summary
        run: |
          echo "### Rollback Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Rolled back to** | \`${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **App Service** | \`${{ vars.APP_SERVICE_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | https://${{ vars.APP_SERVICE_NAME }}.azurewebsites.net |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
